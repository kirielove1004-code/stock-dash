name: Apply Step 1 data foundation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply Step 1 patch
        run: python scripts/apply_step1.py

      - name: Commit providers.py
        run: |
          git config user.name "stock-dash automation"
          git config user.email "actions@github.com"
          git add providers.py
          if git diff --cached --quiet; then
            echo "No providers.py changes needed."
          else
            git commit -m "Implement Step 1 official data enrichment"
            git push
          fi
